name: Tests

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 22.5.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.5.0'

      - name: Install dependencies
        run: npx --yes npm@10.9.9 ci --ignore-scripts --no-audit --no-fund

      - name: Check formatting
        run: npx --yes npm@10.9.9 run prettier:check

      - name: Check documentation synchronization
        run: npx --yes npm@10.9.9 run docs:check

  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.5.0', '24', '26']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npx --yes npm@10.9.9 ci --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npx --yes npm@10.9.9 test

      - name: Check packed release consumers
        if: matrix.node-version == '22.5.0' || matrix.node-version == '26'
        run: npx --yes npm@10.9.9 run release:check
