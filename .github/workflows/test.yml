name: Tests

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.5.0', '24', '26']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npx --yes npm@10.9.9 ci --ignore-scripts --no-audit --no-fund

      - name: Check formatting
        run: npx --yes npm@10.9.9 run prettier:check

      - name: Run tests
        run: npx --yes npm@10.9.9 test

      - name: Check packed release consumers
        if: matrix.node-version == '22.5.0' || matrix.node-version == '26'
        run: npx --yes npm@10.9.9 run release:check
